<div class="phpd-wrap" id="${fragmentEntryLinkNamespace}-documents">

    <div class="phpd-main">
      <div class="phpd-coi-banner" id="${fragmentEntryLinkNamespace}-coi-banner">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex-shrink:0">
          <circle cx="8" cy="8" r="7" stroke="#0F6E56" stroke-width="1.3"/>
          <path d="M5 8L7 10.5L11 5.5" stroke="#0F6E56" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
