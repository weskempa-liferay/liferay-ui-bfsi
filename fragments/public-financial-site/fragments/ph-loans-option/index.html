<div class="ph-loan-option ph-loan-option--${configuration.cardStyle}">
    <div class="ph-loan-option__icon-wrapper">
        <!-- Auto Icon -->
        <svg class="ph-loan-option__icon ph-loan-option__icon--auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-1.1 0-2 .9-2 2v7c0 .6.4 1 1 1h2" />
            <circle cx="7" cy="17" r="2" />
            <circle cx="17" cy="17" r="2" />
        </svg>
        <!-- Home Icon -->
        <svg class="ph-loan-option__icon ph-loan-option__icon--home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
        <!-- Personal/Default Icon -->
        <svg class="ph-loan-option__icon ph-loan-option__icon--personal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="1" x2="12" y2="23" />
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
        </svg>
    </div>

    <h2 class="ph-loan-option__title" data-lfr-editable-id="title" data-lfr-editable-type="text">
        Loan Product Name
    </h2>

    <p class="ph-loan-option__subtitle" data-lfr-editable-id="subtitle" data-lfr-editable-type="text">
        Quickly explain who this loan is for and what makes it special.
    </p>

    <div class="ph-loan-option__features">
        <div class="ph-loan-option__features-label">Loan Details</div>
        <div class="ph-loan-option__features-list">
            <lfr-drop-zone></lfr-drop-zone>
        </div>
    </div>

    <div class="ph-loan-option__footer">
        <a class="ph-loan-option__button" data-lfr-editable-id="link" data-lfr-editable-type="link">
            Learn more
        </a>
    </div>
</div>
