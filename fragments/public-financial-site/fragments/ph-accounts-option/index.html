<div class="ph-account-option ph-account-option--${configuration.cardStyle}">
    <div class="ph-account-option__icon-wrapper">
        <!-- Savings Icon -->
        <svg class="ph-account-option__icon ph-account-option__icon--savings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h2v2h4v-3.5c2-1.5 2-2.7 2-4.5 0-5.3-7.5-6.5-11-5" />
            <path d="M7 11h.01M11 11h.01" />
        </svg>
        <!-- Checking Icon -->
        <svg class="ph-account-option__icon ph-account-option__icon--checking" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="6" width="20" height="12" rx="2" />
            <path d="M12 12h.01" />
            <path d="M17 12h.01" />
            <path d="M7 12h.01" />
        </svg>
        <!-- Investment Icon -->
        <svg class="ph-account-option__icon ph-account-option__icon--investment" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 20V10" />
            <path d="M18 20V4" />
            <path d="M6 20v-4" />
        </svg>
    </div>

    <h2 class="ph-account-option__title" data-lfr-editable-id="title" data-lfr-editable-type="text">
        Account Name
    </h2>

    <p class="ph-account-option__subtitle" data-lfr-editable-id="subtitle" data-lfr-editable-type="text">
        Brief description of the account benefits and target audience.
    </p>

    <div class="ph-account-option__features">
        <div class="ph-account-option__features-label">Key Features</div>
        <div class="ph-account-option__features-list">
            <lfr-drop-zone></lfr-drop-zone>
        </div>
    </div>

    <div class="ph-account-option__footer">
        <a class="ph-account-option__button" data-lfr-editable-id="link" data-lfr-editable-type="link">
            Learn more
        </a>
    </div>
</div>
