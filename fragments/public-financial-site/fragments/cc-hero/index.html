<section class="pf-cc-hero pf-cc-hero--${configuration.theme}">
  <div class="pf-cc-hero__container">
    <div class="pf-cc-hero__content">
      <div class="pf-cc-hero__badge" data-lfr-editable-id="badge" data-lfr-editable-type="text">
        NEW OFFERS FOR 2024
      </div>
      <h1 class="pf-cc-hero__title" data-lfr-editable-id="title" data-lfr-editable-type="text">
        Financial Freedom, Reimagined.
      </h1>
      <p class="pf-cc-hero__subtitle" data-lfr-editable-id="subtitle" data-lfr-editable-type="text">
        Unlock a world of possibilities with Pillar Financial's premium credit cards. Whether you're traveling the world or building your future, we have the perfect card for you.
      </p>
      <div class="pf-cc-hero__actions">
        <a class="pf-cc-hero__btn pf-cc-hero__btn--primary" data-lfr-editable-id="cta-primary" data-lfr-editable-type="link">
          Explore Cards
        </a>
        <a class="pf-cc-hero__btn pf-cc-hero__btn--secondary" data-lfr-editable-id="cta-secondary" data-lfr-editable-type="link">
          Check Eligibility
        </a>
      </div>
    </div>
    <div class="pf-cc-hero__visual">
      <!-- Visual element managed by CSS/SVG -->
      <div class="pf-cc-hero__card-float">
         <div class="pf-cc-hero__card-mock"></div>
         <div class="pf-cc-hero__card-mock pf-cc-hero__card-mock--2"></div>
      </div>
    </div>
  </div>
</section>
