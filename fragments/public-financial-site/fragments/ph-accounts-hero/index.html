<section class="ph-accounts-hero ph-accounts-hero--${configuration.theme}">
    <div class="ph-accounts-hero__container">
        <div class="ph-accounts-hero__content">
            <div class="ph-accounts-hero__badge" data-lfr-editable-id="badge" data-lfr-editable-type="text">
                SMART SAVINGS FOR 2026
            </div>
            <h1 class="ph-accounts-hero__title" data-lfr-editable-id="title" data-lfr-editable-type="text">
                Your Financial Future, <br>Starts with a Single Deposit.
            </h1>
            <p class="ph-accounts-hero__subtitle" data-lfr-editable-id="subtitle" data-lfr-editable-type="text">
                Grow your wealth with Pillar Financial's high-yield accounts. Secure, flexible, and designed to reward your discipline.
            </p>
            <div class="ph-accounts-hero__actions">
                <a class="ph-accounts-hero__btn ph-accounts-hero__btn--primary" data-lfr-editable-id="cta-primary" data-lfr-editable-type="link">
                    Open an Account
                </a>
                <a class="ph-accounts-hero__btn ph-accounts-hero__btn--secondary" data-lfr-editable-id="cta-secondary" data-lfr-editable-type="link">
                    Compare Rates
                </a>
            </div>
        </div>
        <div class="ph-accounts-hero__visual">
            <div class="ph-accounts-hero__shape-container">
                <div class="ph-accounts-hero__shape ph-accounts-hero__shape--1"></div>
                <div class="ph-accounts-hero__shape ph-accounts-hero__shape--2"></div>
                <div class="ph-accounts-hero__shape ph-accounts-hero__shape--3"></div>
            </div>
        </div>
    </div>
</section>
