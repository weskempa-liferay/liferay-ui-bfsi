<section class="ph-leadership ph-leadership--bg-${configuration.backgroundColor}">
    <div class="ph-leadership__container">
        <div class="ph-leadership__header">
            <div class="ph-leadership__eyebrow" data-lfr-editable-id="eyebrow" data-lfr-editable-type="text">Our Leadership</div>
            <h2 class="ph-leadership__title" data-lfr-editable-id="title" data-lfr-editable-type="text">Guided by Experience</h2>
            <div class="ph-leadership__accent"></div>
        </div>
        
        <div class="ph-leadership__grid ph-leadership__grid--cols-${configuration.columns}">
            <div class="ph-leadership__member">
                <div class="ph-leadership__member-image-wrapper">
                    <img data-lfr-editable-id="member-1-image" data-lfr-editable-type="image" 
                         src="https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&q=80&w=600" 
                         alt="Team Member" class="ph-leadership__member-image">
                </div>
                <div class="ph-leadership__member-info">
                    <h3 class="ph-leadership__member-name" data-lfr-editable-id="member-1-name" data-lfr-editable-type="text">Thomas Rossman</h3>
                    <p class="ph-leadership__member-role" data-lfr-editable-id="member-1-role" data-lfr-editable-type="text">Founder & CEO</p>
                </div>
            </div>

            <div class="ph-leadership__member">
                <div class="ph-leadership__member-image-wrapper">
                    <img data-lfr-editable-id="member-2-image" data-lfr-editable-type="image" 
                         src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&q=80&w=600" 
                         alt="Team Member" class="ph-leadership__member-image">
                </div>
                <div class="ph-leadership__member-info">
                    <h3 class="ph-leadership__member-name" data-lfr-editable-id="member-2-name" data-lfr-editable-type="text">Clyde Rossman</h3>
                    <p class="ph-leadership__member-role" data-lfr-editable-id="member-2-role" data-lfr-editable-type="text">Co-Founder</p>
                </div>
            </div>

            <div class="ph-leadership__member">
                <div class="ph-leadership__member-image-wrapper">
                    <img data-lfr-editable-id="member-3-image" data-lfr-editable-type="image" 
                         src="https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?auto=format&fit=crop&q=80&w=600" 
                         alt="Team Member" class="ph-leadership__member-image">
                </div>
                <div class="ph-leadership__member-info">
                    <h3 class="ph-leadership__member-name" data-lfr-editable-id="member-3-name" data-lfr-editable-type="text">Sarah Miller</h3>
                    <p class="ph-leadership__member-role" data-lfr-editable-id="member-3-role" data-lfr-editable-type="text">Chief Investment Officer</p>
                </div>
            </div>

            <div class="ph-leadership__member">
                <div class="ph-leadership__member-image-wrapper">
                    <img data-lfr-editable-id="member-4-image" data-lfr-editable-type="image" 
                         src="https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&fit=crop&q=80&w=600" 
                         alt="Team Member" class="ph-leadership__member-image">
                </div>
                <div class="ph-leadership__member-info">
                    <h3 class="ph-leadership__member-name" data-lfr-editable-id="member-4-name" data-lfr-editable-type="text">Elena Rodriguez</h3>
                    <p class="ph-leadership__member-role" data-lfr-editable-id="member-4-role" data-lfr-editable-type="text">Head of Strategy</p>
                </div>
            </div>
        </div>
    </div>
</section>
