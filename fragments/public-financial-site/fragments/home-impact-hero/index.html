<section class="pf-home-hero">
  <div class="pf-home-hero__bg">
    <img data-lfr-editable-id="background-image" data-lfr-editable-type="image"
      src="https://webserver-lctpillarportal-prd.lfr.cloud/documents/d/pillar/home_hero_lifestyle"
      alt="Banking with Pillar">
    <div class="pf-home-hero__overlay" style="opacity: ${(configuration.overlayOpacity?number!40) / 100}"></div>
  </div>

  <div class="pf-home-hero__container">
    <div class="pf-home-hero__content">
      <!--
      <div class="pf-home-hero__badge" data-lfr-editable-id="badge" data-lfr-editable-type="text">
        VOTED #1 MOBILE BANKING APP
      </div>
      -->
      <h1 class="pf-home-hero__title" data-lfr-editable-id="title" data-lfr-editable-type="text">
        Banking for the<br>Next Generation.
      </h1>
      <p class="pf-home-hero__subtitle" data-lfr-editable-id="subtitle" data-lfr-editable-type="text">
        Secure, simple, and tailored to your lifestyle. Open an account in under 3 minutes and start your journey with
        Pillar today.
      </p>
      <div class="pf-home-hero__actions">
        <a class="pf-home-hero__btn pf-home-hero__btn--primary" data-lfr-editable-id="cta-1"
          data-lfr-editable-type="link">
          Open an Account
        </a>
        <a class="pf-home-hero__btn pf-home-hero__btn--outline" data-lfr-editable-id="cta-2"
          data-lfr-editable-type="link">
          How it Works
        </a>
      </div>
    </div>
    <div>
      <lfr-drop-zone></lfr-drop-zone>
    </div>

  </div>
