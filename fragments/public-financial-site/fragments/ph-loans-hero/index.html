<section class="ph-loans-hero ph-loans-hero--${configuration.theme}">
    <div class="ph-loans-hero__container">
        <div class="ph-loans-hero__content">
            <div class="ph-loans-hero__badge" data-lfr-editable-id="badge" data-lfr-editable-type="text">
                FLEXIBLE FUNDING FOR 2026
            </div>
            <h1 class="ph-loans-hero__title" data-lfr-editable-id="title" data-lfr-editable-type="text">
                Loans Tailored to Your <br>Ambitions and Lifestyle.
            </h1>
            <p class="ph-loans-hero__subtitle" data-lfr-editable-id="subtitle" data-lfr-editable-type="text">
                Whether it's a new home, a car, or a personal project, our competitive rates and fast approval process help you move forward with confidence.
            </p>
            <div class="ph-loans-hero__actions">
                <a class="ph-loans-hero__btn ph-loans-hero__btn--primary" data-lfr-editable-id="cta-primary" data-lfr-editable-type="link">
                    Apply Now
                </a>
                <a class="ph-loans-hero__btn ph-loans-hero__btn--secondary" data-lfr-editable-id="cta-secondary" data-lfr-editable-type="link">
                    View Loan Types
                </a>
            </div>
        </div>
        <div class="ph-loans-hero__visual">
            <div class="ph-loans-hero__shape-container">
                <div class="ph-loans-hero__shape ph-loans-hero__shape--1"></div>
                <div class="ph-loans-hero__shape ph-loans-hero__shape--2"></div>
                <div class="ph-loans-hero__shape ph-loans-hero__shape--3"></div>
            </div>
        </div>
    </div>
</section>
