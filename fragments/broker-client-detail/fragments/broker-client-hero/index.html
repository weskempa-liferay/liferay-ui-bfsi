<div class="bch-wrap" id="${fragmentEntryLinkNamespace}-hero">

  <div class="bch-breadcrumb">
    <a class="bch-breadcrumb__link" href="/web/scif-portal/broker-dash">Command center</a>
    <span class="bch-breadcrumb__sep">›</span>
    <a class="bch-breadcrumb__link" href="/web/scif-portal/broker-dash">Book of business</a>
    <span class="bch-breadcrumb__sep">›</span>
    <span class="bch-breadcrumb__current" id="${fragmentEntryLinkNamespace}-bc-name">Loading...</span>
  </div>

  <div class="bch-hero">
    <div class="bch-hero__top">
      <div class="bch-hero__left">
        <div class="bch-hero__name" id="${fragmentEntryLinkNamespace}-name">—</div>
        <div class="bch-hero__meta" id="${fragmentEntryLinkNamespace}-meta">—</div>
        <div class="bch-hero__policy" id="${fragmentEntryLinkNamespace}-policy">—</div>
        <div class="bch-hero__badges" id="${fragmentEntryLinkNamespace}-badges"></div>
      </div>
      <div class="bch-hero__right">
        <div class="bch-hero__bal-label">Outstanding balance</div>
        <div class="bch-hero__bal" id="${fragmentEntryLinkNamespace}-balance">—</div>
        <div class="bch-hero__bal-due" id="${fragmentEntryLinkNamespace}-bal-due">—</div>
      </div>
    </div>
    <div class="bch-hero__stats">
      <div class="bch-hero__stat">
        <div class="bch-hs__label">Annual premium</div>
        <div class="bch-hs__val" id="${fragmentEntryLinkNamespace}-premium">—</div>
      </div>
      <div class="bch-hero__stat">
        <div class="bch-hs__label">Experience mod</div>
        <div class="bch-hs__val bch-hs__val--xmod" id="${fragmentEntryLinkNamespace}-xmod">—</div>
      </div>
      <div class="bch-hero__stat">
        <div class="bch-hs__label">Open claims</div>
        <div class="bch-hs__val bch-hs__val--claims" id="${fragmentEntryLinkNamespace}-claims">—</div>
      </div>
      <div class="bch-hero__stat">
        <div class="bch-hs__label">Policy expires</div>
        <div class="bch-hs__val bch-hs__val--amber" id="${fragmentEntryLinkNamespace}-expires">—</div>
      </div>
      <div class="bch-hero__stat">
        <div class="bch-hs__label">On-time payments</div>
        <div class="bch-hs__val bch-hs__val--green" id="${fragmentEntryLinkNamespace}-ontime">—</div>
      </div>
    </div>
  </div>

</div>
