<div class="bcn-wrap" id="${fragmentEntryLinkNamespace}-notes">

  <div class="bcn-card">
    <div class="bcn-card__head">
      <span class="bcn-card__title">Activity log</span>
    </div>
    <div id="${fragmentEntryLinkNamespace}-activity-list"></div>
  </div>

  <div class="bcn-card">
    <div class="bcn-card__head">
      <span class="bcn-card__title">Log a note</span>
    </div>
    <div class="bcn-form">
      <textarea
        class="bcn-textarea"
        id="${fragmentEntryLinkNamespace}-note-input"
        placeholder="Add a note about this client..."></textarea>
      <div class="bcn-form__row">
        <button class="bcn-btn bcn-btn--primary" id="${fragmentEntryLinkNamespace}-note-submit">Save note</button>
        <span class="bcn-saved" id="${fragmentEntryLinkNamespace}-note-saved">Note saved.</span>
      </div>
    </div>
  </div>

</div>
