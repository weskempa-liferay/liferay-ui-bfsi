<div class="bcb-wrap" id="${fragmentEntryLinkNamespace}-billing">
  <div class="bcb-card">
    <div class="bcb-card__head">
      <span class="bcb-card__title">Payment history</span>
      <span class="bcb-tag bcb-tag--api">Billing System API</span>
    </div>
    <div class="bcb-summary" id="${fragmentEntryLinkNamespace}-summary">
      <div class="bcb-summary__text" id="${fragmentEntryLinkNamespace}-summary-text">Loading...</div>
      <div class="bcb-summary__bar">
        <div class="bcb-summary__bar-fill" id="${fragmentEntryLinkNamespace}-bar-fill"></div>
      </div>
      <div class="bcb-summary__note" id="${fragmentEntryLinkNamespace}-summary-note"></div>
    </div>
    <div class="bcb-table-wrap">
      <table class="bcb-table">
        <colgroup>
          <col style="width:14%"><col style="width:38%"><col style="width:14%"><col style="width:14%"><col style="width:20%">
        </colgroup>
        <thead>
          <tr>
            <th>Date</th>
            <th>Description</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Running balance</th>
          </tr>
        </thead>
        <tbody id="${fragmentEntryLinkNamespace}-tbody"></tbody>
      </table>
    </div>
  </div>
</div>
