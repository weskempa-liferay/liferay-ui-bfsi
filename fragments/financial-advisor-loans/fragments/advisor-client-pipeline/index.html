<div class="al-table-wrap" id="${fragmentEntryLinkNamespace}-table-wrap">
  <div class="al-table__head">
    <span class="al-table__title">Advisor Loan Pipeline</span>
    <div class="al-table__head-right">
      <span class="al-table__api-tag">Live — Loan Management API</span>
      <div class="al-table__filters">
        <span class="al-table__chip al-table__chip--on" id="${fragmentEntryLinkNamespace}-chip-all" data-filter="all">All Loans</span>
        <span class="al-table__chip" id="${fragmentEntryLinkNamespace}-chip-urgent" data-filter="urgent">Attention Required</span>
        <span class="al-table__chip" id="${fragmentEntryLinkNamespace}-chip-active" data-filter="active">Active</span>
      </div>
    </div>
  </div>

  <div class="al-table__scroll">
    <table class="al-table" id="${fragmentEntryLinkNamespace}-table">
      <thead>
        <tr>
          <th>Client</th>
          <th>Loan ID #</th>
          <th>Status</th>
          <th>Loan Amount</th>
          <th>Review Date</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="${fragmentEntryLinkNamespace}-tbody">
        <!-- Live data injected here -->
      </tbody>
    </table>
  </div>

  <div class="al-pagination" id="${fragmentEntryLinkNamespace}-pagination">
    <span class="al-pagination__summary" id="${fragmentEntryLinkNamespace}-pag-summary">Showing 1–5 of ... clients</span>
    <div class="al-pagination__controls">
      <button class="al-pagination__btn" id="${fragmentEntryLinkNamespace}-pag-prev">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M8.5 3L5 7L8.5 11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="al-pagination__info" id="${fragmentEntryLinkNamespace}-pag-info">Page 1 of ...</span>
      <button class="al-pagination__btn" id="${fragmentEntryLinkNamespace}-pag-next">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5.5 3L9 7L5.5 11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
</div>
