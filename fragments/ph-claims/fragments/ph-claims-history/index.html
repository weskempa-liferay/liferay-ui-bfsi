<div class="phhi-wrap" id="${fragmentEntryLinkNamespace}-history">
  <div class="phhi-card">
    <div class="phhi-card-head">
      <span class="phhi-card-title">Claim history</span>
      <span class="phhi-tag phhi-tag--api">Claims System API</span>
    </div>
    <div class="phhi-controls">
      <div class="phhi-search-wrap">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4.5" stroke="#6b7280" stroke-width="1.2"/><line x1="9" y1="9" x2="12" y2="12" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input type="text" class="phhi-search" id="${fragmentEntryLinkNamespace}-search" placeholder="Search claims by name or ID...">
      </div>
      <div class="phhi-filters" id="${fragmentEntryLinkNamespace}-filters">
        <button class="phhi-filter phhi-filter--active" data-status="all">All</button>
        <button class="phhi-filter" data-status="open">Open</button>
        <button class="phhi-filter" data-status="closed">Closed</button>
      </div>
    </div>
    <div id="${fragmentEntryLinkNamespace}-history-list"></div>
    <div class="phhi-pagination" id="${fragmentEntryLinkNamespace}-pagination"></div>
  </div>
</div>
