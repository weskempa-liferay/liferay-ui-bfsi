<div class="wc-metrics" id="${fragmentEntryLinkNamespace}-metrics">
	<div class="wc-metrics__card">
		<div class="wc-metrics__top">
			<span class="wc-metrics__label">Active policies</span>
			<div class="wc-metrics__icon wc-metrics__icon--blue">
				<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#0071e3" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M2 6h12"/></svg>
			</div>
		</div>
		<div class="wc-metrics__val" id="${fragmentEntryLinkNamespace}-val-policies">47</div>
		<div class="wc-metrics__delta"><span class="wc-metrics__delta--up">+3</span> from last quarter</div>
	</div>

	<div class="wc-metrics__card">
		<div class="wc-metrics__top">
			<span class="wc-metrics__label">Total premium YTD</span>
			<div class="wc-metrics__icon wc-metrics__icon--green">
				<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#00875a" stroke-width="1.5"><path d="M2 12L6 8l3 3 5-6"/></svg>
			</div>
		</div>
		<div class="wc-metrics__val wc-metrics__val--green" id="${fragmentEntryLinkNamespace}-val-premium">$2.14M</div>
		<div class="wc-metrics__delta"><span class="wc-metrics__delta--up">+8.2%</span> vs prior year</div>
	</div>

	<div class="wc-metrics__card">
		<div class="wc-metrics__top">
			<span class="wc-metrics__label">Expiring (60 days)</span>
			<div class="wc-metrics__icon wc-metrics__icon--amber">
				<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#b45309" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 5v3l1.5 1.5"/></svg>
			</div>
		</div>
		<div class="wc-metrics__val wc-metrics__val--amber" id="${fragmentEntryLinkNamespace}-val-expiring">9</div>
		<div class="wc-metrics__delta"><span class="wc-metrics__delta--down">+2</span> need immediate action</div>
	</div>

	<div class="wc-metrics__card">
		<div class="wc-metrics__top">
			<span class="wc-metrics__label">Open claims</span>
			<div class="wc-metrics__icon wc-metrics__icon--red">
				<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#c0392b" stroke-width="1.5"><path d="M8 1.5L2 4v3.5c0 3.5 2.5 6 6 7 3.5-1 6-3.5 6-7V4L8 1.5z"/></svg>
			</div>
		</div>
		<div class="wc-metrics__val wc-metrics__val--red" id="${fragmentEntryLinkNamespace}-val-claims">3</div>
		<div class="wc-metrics__delta"><span class="wc-metrics__delta--up">−1</span> closed this week</div>
	</div>
</div>
