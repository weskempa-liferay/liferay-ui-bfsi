<section class="wp-stats">
  <div class="wp-stats__header">
    <div class="wp-stats__greeting">
      <span class="wp-stats__welcome" data-lfr-editable-id="welcome" data-lfr-editable-type="text">Good
        afternoon,</span>
      <h1 class="wp-stats__name">${user.getFullName()}</h1>
    </div>
    <div class="wp-stats__context">
      <span class="wp-stats__tag">Total Unified Wealth</span>
    </div>
  </div>

  <div class="wp-stats__grid">
    <div class="wp-card wp-card--main">
      <div class="wp-card__label">Total Net Worth</div>
      <div class="wp-card__value" data-lfr-editable-id="net-worth" data-lfr-editable-type="text">$1,248,302.00</div>
      <div class="wp-card__trend wp-card__trend--up">+2.4% this month</div>
    </div>

    <div class="wp-card">
      <div class="wp-card__label">Banking & Cash</div>
      <div class="wp-card__value" data-lfr-editable-id="cash-val" data-lfr-editable-type="text">$84,200.00</div>
      <div class="wp-card__sub">Across 3 accounts</div>
    </div>

    <div class="wp-card">
      <div class="wp-card__label">Investments</div>
      <div class="wp-card__value" data-lfr-editable-id="inv-val" data-lfr-editable-type="text">$942,102.00</div>
      <div class="wp-card__sub">Portfolio Risk: Moderate</div>
    </div>

    <div class="wp-card">
      <div class="wp-card__label">Insurance Coverage</div>
      <div class="wp-card__value" data-lfr-editable-id="ins-val" data-lfr-editable-type="text">$222,000.00</div>
      <div class="wp-card__sub">Total active coverage</div>
    </div>
  </div>
</section>
